<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Smart DB</title>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .card {
      background: #1f2937;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 16px;
    }

    .card h2 {
      margin-top: 0;
      text-align: center;
    }

    .mqtt {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }

    .connected {
      color: #22c55e;
    }

    .disconnected {
      color: #ef4444;
    }

    .connecting {
      color: #f59e0b;
    }

    .status {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      margin: 12px 0;
    }

    .current {
      text-align: center;
      font-size: 36px;
      font-weight: bold;
      margin: 15px 0;
    }

    .buttons {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      border: none;
      padding: 16px;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .on {
      background: #22c55e;
      color: white;
    }

    .off {
      background: #ef4444;
      color: white;
    }

    .master {
      border: 2px solid #374151;
    }

    .footer {
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>⚡ SMART DB</h1>

  <!-- MQTT -->
  <div class="card">
    <div>MQTT Connection</div>

    <div
      id="mqttStatus"
      class="mqtt connecting">
      CONNECTING...
    </div>
  </div>


  <!-- MASTER -->
  <div class="card master">

    <h2>MASTER CONTROL</h2>

    <div
      id="masterStatus"
      class="status">
      OFF
    </div>

    <div class="buttons">

      <button
        class="on"
        onclick="masterON()">
        ALL ON
      </button>

      <button
        class="off"
        onclick="masterOFF()">
        ALL OFF
      </button>

    </div>

  </div>


  <!-- LOAD 1 -->
  <div class="card">

    <h2>LOAD 1</h2>

    <div>
      Status:
      <span id="status1">
        OFF
      </span>
    </div>

    <div
      id="current1"
      class="current">
      0.00 A
    </div>

    <div class="buttons">

      <button
        class="on"
        onclick="load1ON()">
        ON
      </button>

      <button
        class="off"
        onclick="load1OFF()">
        OFF
      </button>

    </div>

  </div>


  <!-- LOAD 2 -->
  <div class="card">

    <h2>LOAD 2</h2>

    <div>
      Status:
      <span id="status2">
        OFF
      </span>
    </div>

    <div
      id="current2"
      class="current">
      0.00 A
    </div>

    <div class="buttons">

      <button
        class="on"
        onclick="load2ON()">
        ON
      </button>

      <button
        class="off"
        onclick="load2OFF()">
        OFF
      </button>

    </div>

  </div>


  <!-- LOAD 3 -->
  <div class="card">

    <h2>LOAD 3</h2>

    <div>
      Status:
      <span id="status3">
        OFF
      </span>
    </div>

    <div
      id="current3"
      class="current">
      0.00 A
    </div>

    <div class="buttons">

      <button
        class="on"
        onclick="load3ON()">
        ON
      </button>

      <button
        class="off"
        onclick="load3OFF()">
        OFF
      </button>

    </div>

  </div>


  <div class="footer">
    Smart DB IoT Monitoring & Control
  </div>

</div>


<script>

// =====================================================
// HIVEMQ WEBSOCKET
// =====================================================

const MQTT_URL =
  "wss://c35c737433a643708ea3ff0497f75990.s1.eu.hivemq.cloud:8884/mqtt";


// =====================================================
// WEB MQTT CREDENTIAL
// =====================================================

// GUNA CREDENTIAL WEB HIVEMQ
const MQTT_USERNAME =
  "smartdbweb";

const MQTT_PASSWORD =
  "naelcantik06";


// =====================================================
// MQTT TOPICS
// =====================================================

// MASTER
const MASTER_COMMAND =
  "smartdb/master/command";

const MASTER_STATUS =
  "smartdb/master/status";


// LOAD 1
const SSR1_COMMAND =
  "smartdb/ssr1/command";

const SSR1_STATUS =
  "smartdb/ssr1/status";

const CURRENT1 =
  "smartdb/current1";


// LOAD 2
const SSR2_COMMAND =
  "smartdb/ssr2/command";

const SSR2_STATUS =
  "smartdb/ssr2/status";

const CURRENT2 =
  "smartdb/current2";


// LOAD 3
const SSR3_COMMAND =
  "smartdb/ssr3/command";

const SSR3_STATUS =
  "smartdb/ssr3/status";

const CURRENT3 =
  "smartdb/current3";


// =====================================================
// CLIENT ID
// =====================================================

const clientId =
  "SmartDB-Web-" +
  Math.random()
    .toString(16)
    .substring(2, 10);


// =====================================================
// CONNECT HIVEMQ
// =====================================================

const client =
  mqtt.connect(
    MQTT_URL,
    {
      username:
        MQTT_USERNAME,

      password:
        MQTT_PASSWORD,

      clientId:
        clientId,

      clean:
        true,

      connectTimeout:
        10000,

      reconnectPeriod:
        3000
    }
  );


// =====================================================
// CONNECTED
// =====================================================

client.on(
  "connect",
  function()
  {
    console.log(
      "HiveMQ CONNECTED"
    );

    const mqttStatus =
      document.getElementById(
        "mqttStatus"
      );

    mqttStatus.innerText =
      "CONNECTED";

    mqttStatus.className =
      "mqtt connected";


    // SUBSCRIBE MASTER
    client.subscribe(
      MASTER_STATUS
    );


    // SUBSCRIBE LOAD 1
    client.subscribe(
      SSR1_STATUS
    );

    client.subscribe(
      CURRENT1
    );


    // SUBSCRIBE LOAD 2
    client.subscribe(
      SSR2_STATUS
    );

    client.subscribe(
      CURRENT2
    );


    // SUBSCRIBE LOAD 3
    client.subscribe(
      SSR3_STATUS
    );

    client.subscribe(
      CURRENT3
    );
  }
);


// =====================================================
// RECEIVE MQTT
// =====================================================

client.on(
  "message",
  function(
    topic,
    message
  )
  {
    const data =
      message.toString();


    // MASTER STATUS
    if (
      topic ===
      MASTER_STATUS
    )
    {
      document.getElementById(
        "masterStatus"
      ).innerText =
        data;
    }


    // LOAD 1 STATUS
    if (
      topic ===
      SSR1_STATUS
    )
    {
      document.getElementById(
        "status1"
      ).innerText =
        data;
    }


    // CURRENT 1
    if (
      topic ===
      CURRENT1
    )
    {
      const value =
        parseFloat(data);

      if (!isNaN(value))
      {
        document.getElementById(
          "current1"
        ).innerText =
          value.toFixed(2)
          + " A";
      }
    }


    // LOAD 2 STATUS
    if (
      topic ===
      SSR2_STATUS
    )
    {
      document.getElementById(
        "status2"
      ).innerText =
        data;
    }


    // CURRENT 2
    if (
      topic ===
      CURRENT2
    )
    {
      const value =
        parseFloat(data);

      if (!isNaN(value))
      {
        document.getElementById(
          "current2"
        ).innerText =
          value.toFixed(2)
          + " A";
      }
    }


    // LOAD 3 STATUS
    if (
      topic ===
      SSR3_STATUS
    )
    {
      document.getElementById(
        "status3"
      ).innerText =
        data;
    }


    // CURRENT 3
    if (
      topic ===
      CURRENT3
    )
    {
      const value =
        parseFloat(data);

      if (!isNaN(value))
      {
        document.getElementById(
          "current3"
        ).innerText =
          value.toFixed(2)
          + " A";
      }
    }
  }
);


// =====================================================
// CONNECTION STATUS
// =====================================================

client.on(
  "offline",
  function()
  {
    const status =
      document.getElementById(
        "mqttStatus"
      );

    status.innerText =
      "OFFLINE";

    status.className =
      "mqtt disconnected";
  }
);


client.on(
  "reconnect",
  function()
  {
    const status =
      document.getElementById(
        "mqttStatus"
      );

    status.innerText =
      "CONNECTING...";

    status.className =
      "mqtt connecting";
  }
);


client.on(
  "error",
  function(error)
  {
    console.error(
      "MQTT ERROR:",
      error
    );

    const status =
      document.getElementById(
        "mqttStatus"
      );

    status.innerText =
      "CONNECTION ERROR";

    status.className =
      "mqtt disconnected";
  }
);


// =====================================================
// CHECK CONNECTION
// =====================================================

function checkMQTT()
{
  if (!client.connected)
  {
    alert(
      "MQTT belum connected"
    );

    return false;
  }

  return true;
}


// =====================================================
// MASTER CONTROL
// =====================================================

function masterON()
{
  if (!checkMQTT())
    return;

  client.publish(
    MASTER_COMMAND,
    "ON"
  );
}


function masterOFF()
{
  if (!checkMQTT())
    return;

  client.publish(
    MASTER_COMMAND,
    "OFF"
  );
}


// =====================================================
// LOAD 1
// =====================================================

function load1ON()
{
  if (!checkMQTT())
    return;

  client.publish(
    SSR1_COMMAND,
    "ON"
  );
}


function load1OFF()
{
  if (!checkMQTT())
    return;

  client.publish(
    SSR1_COMMAND,
    "OFF"
  );
}


// =====================================================
// LOAD 2
// =====================================================

function load2ON()
{
  if (!checkMQTT())
    return;

  client.publish(
    SSR2_COMMAND,
    "ON"
  );
}


function load2OFF()
{
  if (!checkMQTT())
    return;

  client.publish(
    SSR2_COMMAND,
    "OFF"
  );
}


// =====================================================
// LOAD 3
// =====================================================

function load3ON()
{
  if (!checkMQTT())
    return;

  client.publish(
    SSR3_COMMAND,
    "ON"
  );
}


function load3OFF()
{
  if (!checkMQTT())
    return;

  client.publish(
    SSR3_COMMAND,
    "OFF"
  );
}

</script>

</body>
</html>
